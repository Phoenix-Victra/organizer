[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jolly-roger"
version = "0.1.0"
description = "Google review monitor & reply assistant for The Jolly Roger Restaurant and Bar"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30",
    "flask>=3.0",
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "google-api-python-client>=2.126",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "jinja2>=3.1",
]

[project.scripts]
jolly-roger = "jolly_roger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jolly_roger*"]
