<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Jolly Roger Reviews{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #f4f6f9; margin: 0; color: #222; }
    header { background: #1a2d4d; color: #fff; padding: 14px 24px;
             display: flex; align-items: center; gap: 12px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header nav a { color: #a8c4e0; text-decoration: none; margin-left: 20px; font-size: .9rem; }
    header nav a:hover { color: #fff; }
    .container { max-width: 900px; margin: 32px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1);
            padding: 20px 24px; margin-bottom: 20px; }
    .stars { color: #f39c12; font-size: 1.1rem; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px;
             font-size: .75rem; font-weight: 600; text-transform: uppercase; }
    .badge-new      { background: #d5eaf9; color: #1a6fa0; }
    .badge-drafted  { background: #fef3cd; color: #856404; }
    .badge-approved { background: #d4edda; color: #155724; }
    .badge-posted   { background: #c3e6cb; color: #0a4a1f; }
    .badge-rejected { background: #f8d7da; color: #721c24; }
    .badge-skipped  { background: #e2e3e5; color: #383d41; }
    .badge-sensitive { background: #f8d7da; color: #721c24; margin-left: 8px; }
    .btn { display: inline-block; padding: 8px 16px; border-radius: 5px; font-size: .9rem;
           border: none; cursor: pointer; text-decoration: none; font-weight: 500; }
    .btn-primary  { background: #1a6fa0; color: #fff; }
    .btn-success  { background: #28a745; color: #fff; }
    .btn-danger   { background: #dc3545; color: #fff; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn:hover { opacity: .88; }
    textarea { width: 100%; border: 1px solid #ced4da; border-radius: 5px;
               padding: 10px; font-size: .95rem; resize: vertical; }
    .comment-text { background: #f8f9fa; border-left: 3px solid #dee2e6;
                    padding: 10px 14px; border-radius: 0 5px 5px 0; color: #444;
                    white-space: pre-wrap; }
    .flash { padding: 12px 18px; border-radius: 5px; margin-bottom: 16px; }
    .flash-success { background: #d4edda; color: #155724; }
    .flash-error   { background: #f8d7da; color: #721c24; }
    .meta { font-size: .82rem; color: #888; margin-top: 4px; }
    .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-bar a { padding: 6px 14px; border-radius: 20px; font-size: .85rem;
                    text-decoration: none; background: #e9ecef; color: #495057; }
    .filter-bar a.active { background: #1a2d4d; color: #fff; }
    h2.section { font-size: 1rem; color: #555; text-transform: uppercase;
                 letter-spacing: .05em; margin: 0 0 14px; }
    .empty { text-align: center; color: #999; padding: 40px; }
  </style>
</head>
<body>
<header>
  <h1>⚓ Jolly Roger — Review Dashboard</h1>
  <nav>
    <a href="/">All Reviews</a>
    <a href="/?status=drafted">Needs Approval</a>
    <a href="/?status=posted">Posted</a>
  </nav>
</header>
<div class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
